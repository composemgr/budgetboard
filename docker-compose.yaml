# nginx proxy address - http://172.17.0.1:64125

name: budgetboard
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  client:
    image: ghcr.io/teelur/budget-board/client:v3
    container_name: budgetboard-client
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      PORT: 6253
      VITE_SERVER_ADDRESS: budgetboard-server
      VITE_OIDC_ENABLED: false
      VITE_DISABLE_NEW_USERS: false
      VITE_DISABLE_LOCAL_AUTH: false
      CONTAINER_NAME: budgetboard-client
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:6253/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64125:6253'
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - budgetboard

  server:
    image: ghcr.io/teelur/budget-board/server:v3
    container_name: budgetboard-server
    hostname: budgetboard-server
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      ASPNETCORE_HTTP_PORTS: 8080
      CLIENT_ADDRESS: budgetboard-client
      POSTGRES_HOST: budgetboard-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${DB_CREATE_DATABASE_NAME:-budgetboard}
      POSTGRES_USER: ${DB_ADMIN_NAME:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      Logging__LogLevel__Default: Information
      DISABLE_NEW_USERS: false
      DISABLE_LOCAL_AUTH: false
      AUTO_UPDATE_DB: true
      DISABLE_AUTO_SYNC: false
      CONTAINER_NAME: budgetboard-server
    depends_on:
      db:
        condition: service_healthy
    networks:
      - budgetboard

  db:
    image: postgres:latest
    container_name: budgetboard-db
    hostname: budgetboard-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-budgetboard}
      POSTGRES_USER: ${DB_ADMIN_NAME:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      CONTAINER_NAME: budgetboard-db
    volumes:
      - './volumes/db/postgres/budgetboard:/var/lib/postgresql:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      timeout: 45s
      interval: 10s
      retries: 10
    networks:
      - budgetboard

networks:
  budgetboard:
    name: budgetboard
    external: false
